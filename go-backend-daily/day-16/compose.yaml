services:
  api:
    build:
      context: ..
      dockerfile: day-16/Dockerfile
      args:
        VERSION: ${APP_VERSION:-local}
    image: go-runtime-api:day16
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      READ_HEADER_TIMEOUT: ${READ_HEADER_TIMEOUT:-5s}
      READ_TIMEOUT: ${READ_TIMEOUT:-10s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-15s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
