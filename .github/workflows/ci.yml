name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
 test:
  runs-on: ubuntu-latest
  services:
   postgres:
    image: postgres:16
    env: {POSTGRES_USER: recall, POSTGRES_PASSWORD: recall, POSTGRES_DB: recall}
    ports: ["5432:5432"]
    options: --health-cmd "pg_isready -U recall" --health-interval 5s --health-timeout 5s --health-retries 10
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with: {go-version: "1.23", cache: true}
   - run: go mod tidy
   - run: go vet ./...
   - run: go test -race ./...
     env: {DATABASE_URL: postgres://recall:recall@localhost:5432/recall?sslmode=disable, JWT_SECRET: test-secret-test-secret-test-secret}
