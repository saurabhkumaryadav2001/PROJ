openapi: 3.0.3
info:
  title: RecallAPI
  version: 1.0.0
  description: Secure personal memory REST API
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses: {"200": {description: healthy}}
  /readyz:
    get:
      summary: Readiness probe
      responses: {"200": {description: ready}, "503": {description: database unavailable}}
  /v1/auth/register:
    post:
      summary: Register and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 72}
      responses: {"201": {description: registered}, "409": {description: email already exists}}
  /v1/auth/login:
    post:
      summary: Login
      responses: {"200": {description: JWT}, "401": {description: invalid credentials}}
  /v1/memories:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses: {"200": {description: paginated memories}}
    post:
      security: [{bearerAuth: []}]
      summary: Create memory
      responses: {"201": {description: created}}
  /v1/memories/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      security: [{bearerAuth: []}]
      responses: {"200": {description: memory}, "404": {description: not found}}
    put:
      security: [{bearerAuth: []}]
      responses: {"200": {description: updated}}
    delete:
      security: [{bearerAuth: []}]
      responses: {"204": {description: deleted}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
