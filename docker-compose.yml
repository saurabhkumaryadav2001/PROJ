services:
 db:
  image: postgres:16-alpine
  environment: {POSTGRES_DB: recall, POSTGRES_USER: recall, POSTGRES_PASSWORD: recall}
  ports: ["5432:5432"]
  healthcheck: {test: ["CMD-SHELL","pg_isready -U recall"], interval: 5s, timeout: 3s, retries: 10}
  volumes: [postgres_data:/var/lib/postgresql/data]
 api:
  build: .
  ports: ["8080:8080"]
  environment:
   DATABASE_URL: postgres://recall:recall@db:5432/recall?sslmode=disable
   JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in environment}
  depends_on: {db: {condition: service_healthy}}
volumes: {postgres_data: {}}
